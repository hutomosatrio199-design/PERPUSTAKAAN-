<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perpustakaan Digital</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #f5f1e8;
        --card: #fffdf8;
        --text: #29251f;
        --muted: #777067;
        --primary: #795548;
        --primary-dark: #5d4037;
        --border: #e2dbcf;
        --shadow: rgba(0,0,0,.08);
    }

    body.dark {
        --bg: #151515;
        --card: #222;
        --text: #eee;
        --muted: #aaa;
        --primary: #c49a76;
        --primary-dark: #a77d5c;
        --border: #393939;
        --shadow: rgba(0,0,0,.35);
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        transition: .3s;
    }

    /* ================= HEADER ================= */

    header {
        position: sticky;
        top: 0;
        z-index: 100;

        height: 70px;
        padding: 0 7%;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: var(--card);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 2px 10px var(--shadow);
    }

    .logo {
        font-size: 23px;
        font-weight: bold;
        color: var(--primary);
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    button {
        font-family: inherit;
        cursor: pointer;
        border: none;
    }

    .dark-btn {
        width: 42px;
        height: 42px;

        border-radius: 50%;
        background: var(--bg);
        color: var(--text);

        font-size: 19px;
    }

    /* ================= HOME ================= */

    .home {
        max-width: 1200px;
        margin: auto;
        padding: 45px 25px 80px;
    }

    .hero {
        text-align: center;
        padding: 45px 20px;
        margin-bottom: 35px;
    }

    .hero h1 {
        font-size: clamp(32px, 5vw, 52px);
        margin-bottom: 15px;
    }

    .hero p {
        max-width: 650px;
        margin: auto;
        color: var(--muted);
        line-height: 1.7;
    }

    /* ================= SEARCH ================= */

    .search-container {
        max-width: 600px;
        margin: 0 auto 40px;
    }

    .search-container input {
        width: 100%;
        padding: 15px 20px;

        border: 1px solid var(--border);
        border-radius: 30px;

        outline: none;

        background: var(--card);
        color: var(--text);

        font-size: 16px;
    }

    .search-container input:focus {
        border-color: var(--primary);
    }

    /* ================= CATEGORY ================= */

    .categories {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 35px;
    }

    .category {
        padding: 9px 17px;

        border: 1px solid var(--border);
        border-radius: 20px;

        background: var(--card);
        color: var(--text);

        transition: .2s;
    }

    .category:hover,
    .category.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    /* ================= BOOK GRID ================= */

    .book-grid {
        display: grid;

        grid-template-columns:
            repeat(auto-fill, minmax(200px, 1fr));

        gap: 25px;
    }

    .book-card {
        background: var(--card);
        border: 1px solid var(--border);

        border-radius: 12px;

        overflow: hidden;

        box-shadow: 0 5px 15px var(--shadow);

        cursor: pointer;

        transition: .25s;
    }

    .book-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 12px 25px var(--shadow);
    }

    .book-cover {
        height: 270px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 20px;

        color: white;

        font-family: Georgia, serif;
        font-size: 24px;
        font-weight: bold;
    }

    .cover-1 {
        background: linear-gradient(135deg,#795548,#3e2723);
    }

    .cover-2 {
        background: linear-gradient(135deg,#355c7d,#6c5b7b);
    }

    .cover-3 {
        background: linear-gradient(135deg,#134e5e,#71b280);
    }

    .cover-4 {
        background: linear-gradient(135deg,#614385,#516395);
    }

    .cover-5 {
        background: linear-gradient(135deg,#c33764,#1d2671);
    }

    .cover-6 {
        background: linear-gradient(135deg,#cb356b,#bd3f32);
    }

    .book-info {
        padding: 17px;
    }

    .book-info h3 {
        font-family: Georgia, serif;
        margin-bottom: 7px;
    }

    .book-info p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
    }

    .book-category {
        display: inline-block;
        margin-top: 12px;

        padding: 4px 9px;

        border-radius: 10px;

        background: var(--bg);
        color: var(--primary);

        font-size: 12px;
    }

    /* ================= READER ================= */

    .reader-page {
        display: none;
        min-height: calc(100vh - 70px);
    }

    .reader-page.active {
        display: block;
    }

    .reader-header {
        max-width: 850px;
        margin: auto;
        padding: 35px 20px 0;
    }

    .back-btn {
        padding: 10px 17px;

        border-radius: 7px;

        background: var(--card);
        border: 1px solid var(--border);

        color: var(--text);

        margin-bottom: 40px;
    }

    .back-btn:hover {
        background: var(--primary);
        color: white;
    }

    .reader-title {
        text-align: center;
        margin-bottom: 50px;
    }

    .reader-title h1 {
        font-family: Georgia, serif;
        font-size: clamp(32px, 5vw, 50px);
        margin-bottom: 10px;
    }

    .reader-title p {
        color: var(--muted);
    }

    .story {
        max-width: 720px;
        margin: auto;

        padding: 0 20px 100px;

        font-family: Georgia, "Times New Roman", serif;

        font-size: 20px;
        line-height: 1.9;
    }

    .story p {
        margin-bottom: 25px;
        text-align: justify;
        text-indent: 2em;
    }

    .story p:first-child {
        text-indent: 0;
    }

    .story p:first-child::first-letter {
        font-size: 3.5em;
        float: left;
        line-height: .8;
        padding-right: 8px;
        color: var(--primary);
    }

    .reader-footer {
        max-width: 720px;
        margin: auto;
        padding: 0 20px 80px;

        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .reader-nav {
        padding: 12px 20px;

        background: var(--card);
        border: 1px solid var(--border);

        color: var(--text);

        border-radius: 7px;
    }

    .reader-nav:hover {
        background: var(--primary);
        color: white;
    }

    /* ================= NO RESULT ================= */

    .no-result {
        text-align: center;
        padding: 50px;
        color: var(--muted);
        display: none;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:600px) {

        header {
            padding: 0 15px;
        }

        .logo {
            font-size: 18px;
        }

        .home {
            padding: 25px 15px 60px;
        }

        .book-grid {
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;
        }

        .book-cover {
            height: 220px;
            font-size: 20px;
        }

        .book-info {
            padding: 12px;
        }

        .book-info h3 {
            font-size: 16px;
        }

        .story {
            font-size: 18px;
            line-height: 1.8;
        }
    }

    @media(max-width:400px) {

        .book-grid {
            grid-template-columns: 1fr;
        }

        .book-cover {
            height: 280px;
        }
    }
</style>
</head>


<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        📚 PerpustakaanKu
    </div>

    <div class="header-right">

        <button
            class="dark-btn"
            onclick="toggleDarkMode()"
            title="Mode gelap">
            🌙
        </button>

    </div>

</header>


<!-- =====================================================
     HALAMAN DAFTAR BUKU
===================================================== -->

<section
    class="home"
    id="homePage">

    <div class="hero">

        <h1>
            Temukan Cerita Favoritmu
        </h1>

        <p>
            Selamat datang di PerpustakaanKu.
            Pilih buku yang ingin kamu baca dan
            nikmati ceritanya dengan nyaman.
        </p>

    </div>


    <!-- SEARCH -->

    <div class="search-container">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Cari judul buku..."
            oninput="searchBooks()">

    </div>


    <!-- CATEGORY -->

    <div class="categories">

        <button
            class="category active"
            onclick="filterCategory('Semua', this)">
            Semua
        </button>

        <button
            class="category"
            onclick="filterCategory('Romansa', this)">
            Romansa
        </button>

        <button
            class="category"
            onclick="filterCategory('Petualangan', this)">
            Petualangan
        </button>

        <button
            class="category"
            onclick="filterCategory('Misteri', this)">
            Misteri
        </button>

        <button
            class="category"
            onclick="filterCategory('Fantasi', this)">
            Fantasi
        </button>

    </div>


    <!-- BOOKS -->

    <div
        class="book-grid"
        id="bookGrid">
    </div>


    <div
        class="no-result"
        id="noResult">

        <h2>Buku tidak ditemukan 📚</h2>

        <p>
            Coba gunakan kata kunci yang berbeda.
        </p>

    </div>

</section>



<!-- =====================================================
     HALAMAN MEMBACA
===================================================== -->

<section
    class="reader-page"
    id="readerPage">

    <div class="reader-header">

        <button
            class="back-btn"
            onclick="backToLibrary()">
            ← Kembali ke Perpustakaan
        </button>

    </div>


    <div class="reader-title">

        <h1 id="readerTitle">
            Judul Buku
        </h1>

        <p id="readerAuthor">
            Penulis
        </p>

    </div>


    <article
        class="story"
        id="story">
    </article>


    <div class="reader-footer">

        <button
            class="reader-nav"
            id="prevBook"
            onclick="previousBook()">
            ← Buku Sebelumnya
        </button>

        <button
            class="reader-nav"
            id="nextBook"
            onclick="nextBook()">
            Buku Berikutnya →
        </button>

    </div>

</section>



<script>

/* =====================================================
   DATA BUKU

   Tambahkan buku baru di dalam array ini.
===================================================== */

const books = [

    {
        title: "Jejak di Balik Senja",

        author: "A. Pratama",

        category: "Misteri",

        cover: "cover-1",

        story: [

            `Hujan turun perlahan ketika Arga berdiri di peron stasiun yang hampir kosong. Jam tua di atas kepalanya menunjukkan pukul tujuh malam.`,

            `Sebuah pesan misterius telah membawanya ke tempat itu. Pesan yang hanya berisi beberapa kata sederhana, tetapi cukup untuk membuka kembali kenangan yang selama bertahun-tahun ia coba lupakan.`,

            `Datang ke Stasiun Selatan. Aku perlu bertemu denganmu.`,

            `Arga menatap rel yang basah. Ia tidak tahu siapa yang mengirim pesan tersebut. Namun jauh di dalam hatinya, ia sudah mengetahui jawabannya.`,

            `Nama itu adalah Raina.`,

            `Ketika kereta terakhir tiba, seorang perempuan berdiri di balik pintu gerbong. Tatapan mereka bertemu.`,

            `Untuk pertama kalinya setelah sepuluh tahun, masa lalu kembali berdiri tepat di hadapannya.`
        ]
    },


    {
        title: "Langit Setelah Hujan",

        author: "Nadia Putri",

        category: "Romansa",

        cover: "cover-2",

        story: [

            `Hujan baru saja berhenti ketika Alana keluar dari perpustakaan sekolah.`,

            `Langit sore perlahan berubah warna. Awan kelabu mulai bergeser dan cahaya matahari muncul dari balik pepohonan.`,

            `Di depan gerbang, seseorang berdiri sambil memegang sebuah payung.`,

            `Namanya Dimas.`,

            `Mereka sebenarnya sudah saling mengenal sejak lama. Namun hari itu terasa berbeda.`,

            `Dimas tersenyum dan menyerahkan payung kepadanya.`,

            `Alana tidak mengatakan apa-apa. Ia hanya tersenyum kecil dan berjalan bersamanya.`,

            `Kadang-kadang, sesuatu yang indah memang dimulai dari hal yang sangat sederhana.`
        ]
    },


    {
        title: "Pulau Tanpa Nama",

        author: "Raka Wijaya",

        category: "Petualangan",

        cover: "cover-3",

        story: [

            `Kapal kecil itu telah berlayar selama tiga hari ketika kapten menemukan sebuah pulau yang tidak tercantum dalam peta.`,

            `Pulau tersebut dikelilingi kabut putih yang sangat tebal.`,

            `Tidak ada seorang pun yang mengetahui apa yang berada di balik kabut itu.`,

            `Namun rasa penasaran membuat mereka memutuskan untuk mendarat.`,

            `Begitu kaki mereka menyentuh pasir pantai, kompas di tangan kapten tiba-tiba berhenti bekerja.`,

            `Di tengah hutan mereka menemukan jalan batu tua yang seolah-olah telah menunggu seseorang selama ratusan tahun.`,

            `Mereka mengikuti jalan tersebut tanpa mengetahui bahwa perjalanan mereka akan mengubah kehidupan mereka selamanya.`
        ]
    },


    {
        title: "Pintu Nomor Tiga Belas",

        author: "D. Mahendra",

        category: "Misteri",

        cover: "cover-4",

        story: [

            `Hotel tua itu memiliki dua belas lantai.`,

            `Namun di dalam lift terdapat sebuah tombol dengan angka tiga belas.`,

            `Tidak ada seorang pun yang pernah membicarakannya.`,

            `Suatu malam, Rian yang sedang menginap di hotel tersebut tanpa sengaja menekan tombol itu.`,

            `Pintu lift terbuka di sebuah lorong panjang yang tidak pernah ia lihat sebelumnya.`,

            `Lampu-lampu di lorong menyala satu demi satu.`,

            `Di ujung lorong terdapat sebuah pintu.`,

            `Di pintu itu tertulis namanya.`
        ]
    },


    {
        title: "Kerajaan Awan",

        author: "Maya Lestari",

        category: "Fantasi",

        cover: "cover-5",

        story: [

            `Di atas awan terdapat sebuah kerajaan yang tidak pernah terlihat oleh manusia.`,

            `Kerajaan itu dipimpin oleh seorang ratu muda bernama Elara.`,

            `Selama ratusan tahun, kerajaan tersebut hidup dalam kedamaian.`,

            `Namun suatu pagi, sebuah bintang hitam muncul di langit.`,

            `Kemunculan bintang tersebut merupakan tanda bahwa sesuatu dari dunia bawah telah kembali.`,

            `Elara kemudian memilih seorang pemuda biasa untuk menjalankan misi yang tidak pernah dilakukan oleh siapa pun sebelumnya.`,

            `Ia harus turun ke dunia manusia dan menemukan sumber kegelapan tersebut.`
        ]
    },


    {
        title: "Kota yang Hilang",

        author: "Fajar Ramadhan",

        category: "Petualangan",

        cover: "cover-6",

        story: [

            `Peta tua itu ditemukan di dalam sebuah buku yang sudah berusia lebih dari seratus tahun.`,

            `Tidak ada nama pada peta tersebut. Hanya terdapat sebuah tanda merah di tengah hutan.`,

            `Raka yakin tanda itu menunjukkan lokasi sebuah kota yang selama ini dianggap hanya legenda.`,

            `Bersama tiga orang temannya, ia memulai perjalanan.`,

            `Mereka harus melewati sungai, pegunungan, dan hutan yang belum pernah dijelajahi manusia modern.`,

            `Setelah perjalanan panjang, mereka akhirnya melihat sesuatu di balik pepohonan.`,

            `Menara batu menjulang tinggi di hadapan mereka.`,

            `Kota yang selama ini mereka cari ternyata benar-benar ada.`
        ]
    }

];


/* =====================================================
   STATE
===================================================== */

let currentBook = 0;
let currentCategory = "Semua";


/* =====================================================
   ELEMENT
===================================================== */

const bookGrid =
    document.getElementById("bookGrid");

const noResult =
    document.getElementById("noResult");

const homePage =
    document.getElementById("homePage");

const readerPage =
    document.getElementById("readerPage");

const readerTitle =
    document.getElementById("readerTitle");

const readerAuthor =
    document.getElementById("readerAuthor");

const story =
    document.getElementById("story");


/* =====================================================
   MENAMPILKAN SEMUA BUKU
===================================================== */

function displayBooks(list = books) {

    bookGrid.innerHTML = "";

    if (list.length === 0) {

        noResult.style.display = "block";

        return;

    }

    noResult.style.display = "none";


    list.forEach((book) => {

        const originalIndex =
            books.indexOf(book);


        const card =
            document.createElement("div");

        card.className = "book-card";

        card.onclick = () => {
            openBook(originalIndex);
        };


        card.innerHTML = `

            <div class="book-cover ${book.cover}">
                ${book.title}
            </div>

            <div class="book-info">

                <h3>
                    ${book.title}
                </h3>

                <p>
                    ${book.author}
                </p>

                <span class="book-category">
                    ${book.category}
                </span>

            </div>
        `;


        bookGrid.appendChild(card);

    });

}


/* =====================================================
   MEMBUKA BUKU
===================================================== */

function openBook(index) {

    currentBook = index;

    const book =
        books[index];


    readerTitle.textContent =
        book.title;

    readerAuthor.textContent =
        "Oleh " + book.author;


    story.innerHTML = "";


    book.story.forEach(paragraph => {

        const p =
            document.createElement("p");

        p.textContent =
            paragraph;

        story.appendChild(p);

    });


    homePage.style.display =
        "none";

    readerPage.classList.add("active");


    updateReaderButtons();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    // Simpan buku terakhir
    localStorage.setItem(
        "lastBook",
        index
    );

}


/* =====================================================
   KEMBALI KE PERPUSTAKAAN
===================================================== */

function backToLibrary() {

    readerPage.classList.remove(
        "active"
    );

    homePage.style.display =
        "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   BUKU SEBELUMNYA
===================================================== */

function previousBook() {

    if (currentBook > 0) {

        openBook(
            currentBook - 1
        );

    }

}


/* =====================================================
   BUKU BERIKUTNYA
===================================================== */

function nextBook() {

    if (
        currentBook <
        books.length - 1
    ) {

        openBook(
            currentBook + 1
        );

    }

}


/* =====================================================
   UPDATE TOMBOL
===================================================== */

function updateReaderButtons() {

    document.getElementById(
        "prevBook"
    ).disabled =
        currentBook === 0;


    document.getElementById(
        "nextBook"
    ).disabled =
        currentBook === books.length - 1;

}


/* =====================================================
   PENCARIAN
===================================================== */

function searchBooks() {

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        books.filter(book => {

            const matchTitle =
                book.title
                .toLowerCase()
                .includes(keyword);

            const matchAuthor =
                book.author
                .toLowerCase()
                .includes(keyword);

            const matchCategory =
                book.category
                .toLowerCase()
                .includes(keyword);


            const matchFilter =
                currentCategory === "Semua" ||
                book.category === currentCategory;


            return (
                (matchTitle ||
                matchAuthor ||
                matchCategory) &&
                matchFilter
            );

        });


    displayBooks(filtered);

}


/* =====================================================
   FILTER KATEGORI
===================================================== */

function filterCategory(category, button) {

    currentCategory =
        category;


    document
        .querySelectorAll(".category")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    searchBooks();

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "darkMode",
        document.body.classList.contains(
            "dark"
        )
    );

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        // Escape = kembali
        if (
            event.key === "Escape" &&
            readerPage.classList.contains("active")
        ) {

            backToLibrary();

        }


        // Arrow Left
        if (
            event.key === "ArrowLeft" &&
            readerPage.classList.contains("active")
        ) {

            previousBook();

        }


        // Arrow Right
        if (
            event.key === "ArrowRight" &&
            readerPage.classList.contains("active")
        ) {

            nextBook();

        }

    }
);


/* =====================================================
   LOAD DARK MODE
===================================================== */

function loadDarkMode() {

    const dark =
        localStorage.getItem(
            "darkMode"
        );


    if (dark === "true") {

        document.body.classList.add(
            "dark"
        );

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

loadDarkMode();

displayBooks();

</script>

</body>
</html>
